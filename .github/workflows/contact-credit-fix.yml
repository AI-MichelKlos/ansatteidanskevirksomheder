name: Ret grafikcredit og kontakt

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/contact-credit-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Ret credit og kontakt
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          old = 'Grafik og databehandling: Danske A-kasser'
          new = 'Grafik og databehandling: Michel Klos'
          if old not in text:
              raise RuntimeError('Gammel grafikcredit mangler')
          text = text.replace(old, new)
          if 'mailto:mk@danskeakasser.dk' not in text:
              anchor = '&nbsp;|&nbsp; Grafik og databehandling: Michel Klos\n  </div>'
              replacement = '&nbsp;|&nbsp; Grafik og databehandling: Michel Klos<br>\n    Kontakt: <a href="mailto:mk@danskeakasser.dk">mk@danskeakasser.dk</a>\n  </div>'
              if anchor not in text:
                  raise RuntimeError('Kunne ikke finde kildeblokken')
              text = text.replace(anchor, replacement, 1)
          p.write_text(text, encoding='utf-8')
          PY
      - name: Kontroller
        shell: bash
        run: |
          grep -Fq 'Grafik og databehandling: Michel Klos' index.html
          grep -Fq 'mailto:mk@danskeakasser.dk' index.html
          ! grep -Fq 'Grafik og databehandling: Danske A-kasser' index.html
      - name: Gem
        shell: bash
        run: |
          git config user.name "ChatGPT dashboard update"
          git config user.email "dashboard-automation@users.noreply.github.com"
          git add index.html
          git commit -m "Ret grafikcredit og tilføj kontakt"
          git push origin HEAD:main
